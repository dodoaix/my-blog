site_name: DODO AIX
site_url: https://dodoaix.top/
copyright: '备案/许可证编号：豫ICP备2026044907号　<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">工信部ICP备案</a>'

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  - pymdownx.blocks.caption

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/motto.css

nav:
  - Home: index.md
  - Projects:
      - projects/index.md
      - "TITO Transformer":
          - projects/tito-transformer/index.md
          - projects/tito-transformer/01-tensor.md
      - "Diffusion from Scratch: From DiT to Image Editing":
          - projects/diffusion-from-scratch/index.md
