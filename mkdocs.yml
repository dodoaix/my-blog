site_name: My Blog

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  - pymdownx.blocks.caption

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Projects:
      - projects/index.md
      - "Diffusion from Scratch: From DiT to Image Editing":
          - projects/diffusion-from-scratch/index.md
          - "00. Prerequisites": projects/diffusion-from-scratch/00-prerequisites.md
          - "01. Diffusion Fundamentals": projects/diffusion-from-scratch/01-diffusion-fundamentals.md
          - "02. Building a DiT Backbone": projects/diffusion-from-scratch/02-building-dit-backbone.md
          - "03. Training a DiT": projects/diffusion-from-scratch/03-training-dit.md
          - "04. Sampling and Inference": projects/diffusion-from-scratch/04-sampling-and-inference.md
          - "05. Conditioning and Guidance": projects/diffusion-from-scratch/05-conditioning-and-guidance.md
          - "06. From Generation to Image-to-Image": projects/diffusion-from-scratch/06-image-to-image.md
          - "07. Image Editing Architectures": projects/diffusion-from-scratch/07-image-editing-architectures.md
          - "08. Building an Image Editing Pipeline": projects/diffusion-from-scratch/08-building-image-editing-pipeline.md
          - "09. Training Image Editing Models": projects/diffusion-from-scratch/09-training-image-editing-models.md
          - "10. Efficient Inference and Deployment": projects/diffusion-from-scratch/10-efficient-inference-and-deployment.md
  - Notes: notes/index.md
  - Research: research/index.md
  - About: about.md
  - Tests:
      - Elements: tests/elements.md
